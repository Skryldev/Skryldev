name: GitHub Metrics

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

env:
  USERNAME: Skryldev
  TZ: Asia/Tehran
  TEMPLATE: classic
  DISPLAY: large
  OUTPUT_DIR: assets/metrics

jobs:
  metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/overview.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}
          config_display: ${{ env.DISPLAY }}

          base: header, activity, repositories, metadata

          plugin_introduction: yes
          plugin_followup: yes
          plugin_stars: yes

      - name: Generate Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/languages.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used,recent
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: github

      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/achievements.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_achievements: yes
          plugin_achievements_display: detailed

      - name: Generate Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/habits.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Generate Repository Insights
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/repositories.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_types: commit

      - name: Generate Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/activity.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_lines: yes

      - name: Generate Topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/topics.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USERNAME }}

          filename: ${{ env.OUTPUT_DIR }}/calendar.svg

          output_action: commit
          committer_branch: main

          template: ${{ env.TEMPLATE }}
          config_timezone: ${{ env.TZ }}

          base: ""

          plugin_isocalendar: yes
